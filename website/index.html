<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Buddy — Home</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-brand" href="/index.html" aria-current="page">Study Buddy</a>
        <div class="site-header__actions">
          <div class="add-menu">
            <button
              type="button"
              id="add-menu-button"
              class="button button--icon"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="add-menu"
              aria-label="Create"
              title="Create"
            >
              +
            </button>
            <div id="add-menu" class="add-menu__panel" hidden role="menu">
              <button type="button" class="add-menu__item" data-action="new-class" role="menuitem">
                New Class
              </button>
              <button type="button" class="add-menu__item" data-action="new-cardset" role="menuitem">
                New Cardset
              </button>
            </div>
          </div>
          <button
            type="button"
            id="open-settings"
            class="button button--icon button--secondary"
            title="Settings"
            aria-label="Settings"
          >
            ⚙
          </button>
        </div>
      </div>
    </header>

    <main class="site-main">
      <div class="page-toolbar">
        <nav class="breadcrumb" id="home-breadcrumb" aria-label="Breadcrumb">
          <span class="breadcrumb__current" aria-current="page">Home</span>
        </nav>

        <div class="session-menu page-toolbar__menu">
          <button
            type="button"
            id="home-menu-button"
            class="button button--icon button--secondary"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="home-menu"
            aria-label="More actions"
            title="More actions"
          >
            ⋯
          </button>
          <div id="home-menu" class="add-menu__panel set-menu" hidden role="menu">
            <button type="button" class="add-menu__item" data-menu="import" role="menuitem">
              Import class
            </button>
            <button type="button" class="add-menu__item" data-menu="export" role="menuitem">
              Export class
            </button>
          </div>
          <input type="file" id="import-class" accept="application/json,.json" hidden />
        </div>
      </div>

      <div class="page-scroll">
        <div id="classes-grid" class="tile-grid" aria-live="polite"></div>

        <div id="home-empty" class="tile-empty-block" hidden>
          <p class="tile-empty">No classes yet</p>
          <button type="button" id="home-add-class" class="button">Add class</button>
        </div>

        <p id="home-status" class="form-status" role="status" aria-live="polite"></p>
      </div>
    </main>

    <!-- New Class dialog -->
    <dialog id="new-class-dialog" class="app-dialog">
      <form method="dialog" id="new-class-form" class="card-form">
        <h2>New Class</h2>
        <label for="new-class-title">Title</label>
        <input type="text" id="new-class-title" name="title" required maxlength="120" />
        <div class="file-upload file-upload--dialog">
          <input
            type="file"
            id="new-class-cover"
            class="file-upload__input visually-hidden"
            accept="image/*"
          />
          <label
            for="new-class-cover"
            class="button button--icon button--secondary file-upload__trigger"
            title="Add cover photo"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <circle cx="8.5" cy="10.5" r="1.5"></circle>
              <path d="m21 15-5-5-4 4-2-2-6 6"></path>
            </svg>
            <span class="visually-hidden">Cover photo</span>
          </label>
          <span id="new-class-cover-status" class="file-upload__status">Cover photo</span>
        </div>
        <p id="new-class-status" class="form-status" role="status"></p>
        <div class="card-form__actions">
          <button type="submit" value="cancel" class="button button--secondary" formnovalidate>
            Cancel
          </button>
          <button type="submit" value="create" class="button">Create</button>
        </div>
      </form>
    </dialog>

    <dialog id="export-class-dialog" class="app-dialog">
      <form method="dialog" id="export-class-form" class="card-form">
        <h2>Export class</h2>
        <label for="export-class-select">Class</label>
        <select id="export-class-select" required></select>
        <p id="export-class-status" class="form-status" role="status"></p>
        <div class="card-form__actions">
          <button type="submit" value="cancel" class="button button--secondary" formnovalidate>
            Cancel
          </button>
          <button type="submit" value="export" class="button">Export</button>
        </div>
      </form>
    </dialog>

    <script src="/js/api.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/home-page.js"></script>
  </body>
</html>
