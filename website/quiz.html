<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Buddy — Quiz</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <nav class="site-nav" aria-label="Main">
          <a href="/index.html">Study</a>
          <a href="/quiz.html" aria-current="page">Quiz</a>
          <a href="/cards.html">Cards</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <!-- Sub-tabs: Start a quiz | Review quizzes -->
      <div class="subtabs" role="tablist" aria-label="Quiz sections">
        <button
          type="button"
          class="subtabs__button is-active"
          role="tab"
          id="tab-start"
          aria-selected="true"
          aria-controls="panel-start"
          data-tab="start"
        >
          Start a quiz
        </button>
        <button
          type="button"
          class="subtabs__button"
          role="tab"
          id="tab-review"
          aria-selected="false"
          aria-controls="panel-review"
          data-tab="review"
        >
          Review quizzes
        </button>
      </div>

      <!-- ========== START A QUIZ ========== -->
      <div
        id="panel-start"
        class="subtab-panel"
        role="tabpanel"
        aria-labelledby="tab-start"
      >
        <!-- Setup: filters + Start (card hidden until Start) -->
        <section id="quiz-setup" class="panel study-setup">
          <h2>Your deck</h2>

          <h3 class="tag-filter__heading">Filters</h3>
          <p id="quiz-tag-filter-empty" class="field-hint" hidden>
            No tags yet. Add tags on the Cards page to filter here.
          </p>
          <fieldset id="quiz-tag-filter" class="tag-filter">
            <legend class="visually-hidden">Tag filters</legend>
          </fieldset>
          <p id="quiz-deck-count" class="study-meta study-setup__count">Selected 0 cards</p>
          <div
            id="quiz-selected-cards"
            class="quiz-selected-cards tag-filter"
            role="list"
            aria-label="Selected cards"
          ></div>

          <div class="study-setup__actions">
            <button type="button" id="quiz-start" class="button" disabled>Start</button>
            <p id="quiz-setup-message" class="form-status" role="status"></p>
          </div>
        </section>

        <!-- Active session -->
        <section id="quiz-session" class="study-layout" hidden>
          <p id="quiz-meta" class="study-meta"></p>

          <div class="quiz-deck-stage">
            <div id="quiz-deck" class="deck">
              <div class="deck__slot deck__slot--under" id="quiz-deck-under">
                <article class="flashcard flashcard--static" aria-hidden="true">
                  <div class="flashcard__face">
                    <p class="flashcard__title" data-field="title"></p>
                    <p class="flashcard__text" data-field="text"></p>
                    <p class="flashcard__subtitle" data-field="subtitle"></p>
                  </div>
                </article>
              </div>

              <div class="deck__slot deck__slot--top" id="quiz-deck-top">
                <article
                  id="quiz-flashcard"
                  class="flashcard"
                  role="button"
                  tabindex="0"
                  aria-label="Flashcard. Click or press Enter to flip."
                >
                  <div class="flashcard__face">
                    <p class="flashcard__title" data-field="title"></p>
                    <p class="flashcard__text" data-field="text"></p>
                    <p class="flashcard__subtitle" data-field="subtitle"></p>
                  </div>
                </article>
              </div>
            </div>

            <!-- Correct / incorrect flash — centered on the card area -->
            <div id="answer-flash" class="answer-flash" hidden aria-hidden="true">
              <span id="answer-flash-mark" class="answer-flash__mark"></span>
            </div>
          </div>

          <div class="study-actions">
            <button type="button" id="quiz-correct" class="button">Correct</button>
            <button type="button" id="quiz-incorrect" class="button button--danger">Incorrect</button>
          </div>
        </section>

        <!-- Results after finishing (also saved to the server) -->
        <section id="quiz-results" class="panel" hidden>
          <h2>Results</h2>
          <p id="quiz-results-summary" class="study-meta"></p>
          <div id="quiz-results-wrong">
            <!-- Wrong cards listed here -->
          </div>
          <div class="card-form__actions">
            <button type="button" id="quiz-try-again" class="button">New Quiz</button>
            <button type="button" id="quiz-go-review" class="button button--secondary">
              Review quizzes
            </button>
          </div>
        </section>
      </div>

      <!-- ========== REVIEW QUIZZES ========== -->
      <div
        id="panel-review"
        class="subtab-panel"
        role="tabpanel"
        aria-labelledby="tab-review"
        hidden
      >
        <section id="review-list-panel" class="panel">
          <h2>Past quizzes</h2>
          <p id="review-list-status" class="study-meta">Loading…</p>

          <h3 class="tag-filter__heading">Filters</h3>
          <p id="review-tag-filter-empty" class="field-hint" hidden>
            No tags on past quizzes yet.
          </p>
          <fieldset id="review-tag-filter" class="tag-filter">
            <legend class="visually-hidden">Filter past quizzes by tags</legend>
          </fieldset>
          <label for="review-text-filter" class="visually-hidden">Search quizzes</label>
          <input
            type="search"
            id="review-text-filter"
            class="cards-text-filter"
            placeholder="Search title, front, back…"
            autocomplete="off"
          />

          <div id="review-list" class="review-list">
            <!-- Filled by quiz-page.js -->
          </div>
        </section>

        <section id="review-detail" class="panel" hidden>
          <h2>Quiz detail</h2>
          <p id="review-detail-summary" class="study-meta"></p>
          <div id="review-detail-body"></div>
          <div class="card-form__actions">
            <button type="button" id="review-detail-close" class="button button--secondary">
              Back to list
            </button>
            <button type="button" id="review-detail-delete" class="button button--danger">
              Delete quiz
            </button>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <p>
        Manage quizzes under
        <a href="#panel-review" id="footer-goto-review">Review Quizzes</a>.
      </p>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/quiz-page.js"></script>
  </body>
</html>
